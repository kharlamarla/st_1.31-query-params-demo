<a id="answer"></a>
<div class="sheet">
  <span class="label">Текст</span>
  <div class="cloze-text">{{cloze:Text}}</div>
  {{#Extra}}<hr><div class="extra">{{Extra}}</div>{{/Extra}}
  {{#Quote}}<blockquote class="quote">{{Quote}}</blockquote>{{/Quote}}
  {{#Code}}<div class="code-wrap">{{#CodeLang}}<span class="code-lang">{{CodeLang}}</span>{{/CodeLang}}<pre class="code-block"><code>{{Code}}</code></pre></div>{{/Code}}
  {{#Notes}}<div class="desc"><span class="label">Описание</span>{{Notes}}</div>{{/Notes}}
</div>
{{#Code}}<script src="_codehl.js"></script><script>window.__codehl&&window.__codehl()</script>{{/Code}}
<script>(function(){var a=document.getElementById("answer");if(!a)return;setTimeout(function(){try{a.scrollIntoView({block:"start"});}catch(e){a.scrollIntoView();}},60);})();</script>
