{{FrontSide}}
<a id="answer"></a>
<div class="sheet answer-sheet" id="mc-back">
  <span class="label">Правильный ответ</span>
  <div class="answer" id="mc-correct-text"></div>
  {{#Explanation}}<div class="mc-explain"><span class="label">Пояснение</span>{{Explanation}}</div>{{/Explanation}}
</div>
<script>(function(){var a=document.getElementById("answer");if(!a)return;setTimeout(function(){try{a.scrollIntoView({block:"start"});}catch(e){a.scrollIntoView();}},120);})();</script>
